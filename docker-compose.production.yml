# Production Docker Compose override
#
# 生产环境专用配置 — 只拉取指定镜像，不从源码构建。
# 需要设置 IMAGE_REF 环境变量（必须包含版本或 digest）：
#
#   export IMAGE_REF=ghcr.io/<owner>/orzmusic:0.0.1
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d app
#
# 数据库与 CAS volume 名称与开发配置一致，数据可共用。
# 使用前需确保 db 服务正常运行。

# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_HOST: db
  DATABASE_NAME: vapor_database
  DATABASE_USERNAME: vapor_username
  DATABASE_PASSWORD: vapor_password
  CAS_ROOT: /data/music

volumes:
  db_data:
  cas_data:

services:
  cas-init:
    image: ${IMAGE_REF:?IMAGE_REF is required — use ghcr.io/<owner>/orzmusic:<version>}
    build: !reset null
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 999:999 /data/music"]
    volumes:
      - cas_data:/data/music
    restart: "no"

  app:
    image: ${IMAGE_REF:?IMAGE_REF is required — use ghcr.io/<owner>/orzmusic:<version>}
    build: !reset null
    # 生产环境同样要求宿主/Docker 重启后自愈。
    restart: unless-stopped
    environment:
      <<: *shared_environment
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      SCAN_ROOT: /sources/music
    depends_on:
      db:
        condition: service_healthy
      cas-init:
        condition: service_completed_successfully
    ports:
      - '8080:8080'
    volumes:
      - cas_data:/data/music
      - ${MUSIC_DIR:-./keygenmusic}:/sources/music:ro
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]

  migrate:
    image: ${IMAGE_REF:?IMAGE_REF is required — use ghcr.io/<owner>/orzmusic:<version>}
    build: !reset null
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0

  db:
    # 生产环境不向宿主发布 PostgreSQL 端口；!reset 清空基础文件里的 127.0.0.1 调试映射。
    # 注意：加了这个覆盖段后，必须同时使用 -f docker-compose.yml -f docker-compose.production.yml。
    ports: !reset []
