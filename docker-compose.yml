# Docker Compose for OrzPlayer Service (CAS 版)
#
#   Build images: docker compose build
#      Start app: docker compose up app
# Start database: docker compose up db
# Run migrations: docker compose run migrate
# Import music: ADMIN_API_TOKEN=... curl -X POST http://localhost:8080/api/scan
#       Stop all: docker compose down (add -v to wipe db)

# 固定项目名：Compose 默认用目录名作为项目名，按版本目录切换部署时会新建项目与全新
# volume（等于新建空数据库），导致升级不复用数据。这里钉死 name 作安全网；仍可通过
# COMPOSE_PROJECT_NAME 环境变量或 --project-name 覆盖（优先级高于 name 字段）。
name: orzmusic

volumes:
  db_data:
  cas_data:

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_HOST: db
  DATABASE_NAME: vapor_database
  DATABASE_USERNAME: vapor_username
  DATABASE_PASSWORD: vapor_password
  CAS_ROOT: /data/music
  SERVER_DECODE_CONCURRENCY: ${SERVER_DECODE_CONCURRENCY:-1}

services:
  cas-init:
    image: music-service:latest
    build:
      context: .
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 999:999 /data/music"]
    volumes:
      - cas_data:/data/music
    restart: "no"

  app:
    # 资源上限（2026-09-03：Docker Desktop VM 扩容 8G/4vCPU 后加装防御性保险丝）
    deploy:
      resources:
        limits:
          memory: 512M
    # 宿主/Docker 重启或容器崩溃后自愈；与一次性 cas-init 的 restart: "no" 形成对照。
    restart: unless-stopped
    image: music-service:latest
    build:
      context: .
    environment:
      <<: *shared_environment
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      SCAN_ROOT: /sources/music
    depends_on:
      db:
        condition: service_healthy
      cas-init:
        condition: service_completed_successfully
    ports:
      - '8080:8080'
    volumes:
      - cas_data:/data/music
      - ${MUSIC_DIR:-./keygenmusic}:/sources/music:ro
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]

  migrate:
    image: music-service:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0

  db:
    # 资源上限（2026-09-03：Docker Desktop VM 扩容 8G/4vCPU 后加装防御性保险丝）
    deploy:
      resources:
        limits:
          memory: 512M
    # 宿主/Docker 重启或容器崩溃后自愈；与一次性 cas-init 的 restart: "no" 形成对照。
    restart: unless-stopped
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vapor_username
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: vapor_database
    # 仅供宿主本机调试（native 部署 / psql）；绑定 127.0.0.1 而非 0.0.0.0。
    # 生产叠加 docker-compose.production.yml 后该端口映射会被清空，不向宿主发布。
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapor_username -d vapor_database"]
      interval: 5s
      timeout: 5s
      retries: 5
