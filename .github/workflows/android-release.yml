name: Android Release

# 客户端用自己的 tag 命名空间 android-vX.Y.Z:
#   · 根目录的 vX.Y.Z 是**服务端**版本,release.yml 会拿 VERSION 文件硬校验;
#   · 客户端版本在 clients/android/version.properties,两条线独立推进。
#
# 分工(2026-11-20 起):
#   · 构建 → 本仓库(clients/android)
#   · 密钥还原 / 产物校验(包名 · 版本 · 非 debuggable · debug 钩子 · ABI ·
#     签名指纹 · AAB 结构与 jarsigner)/ manifest → EasyIndie/EasyRelease 的
#     `android/` action(与 Apple 侧同一套发布基础设施)
#   · Release 资产与正文 → 本仓库下面的 publish job(正文是产品话术,不放公共库)
#
# 签名与校验逻辑不再复制在本文件里;改校验规则去 EasyRelease 改,所有仓库一起受益。

on:
  push:
    tags:
      - "android-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    # 生产 pin 精确 tag;升级 EasyRelease 时改这一处。
    uses: EasyIndie/EasyRelease/.github/workflows/android-release.yml@android-v0.1.0
    # ⚠️ 必须是 write:被调 workflow 声明了 contents: write(它要能建 Release),
    # 而 GitHub 只允许「降权」不允许「提权」——这里给 read 会让整个 run 直接
    # startup_failure,而且报错信息只有「workflow file issue」,很难定位。
    permissions:
      contents: write
    with:
      app: OrzMusic-Android
      package_name: com.jokerhub.orzmusic.android
      # tag android-v0.7.1 → 版本 0.7.1,并与 version.properties 断言一致
      tag_prefix: android-v
      version_file: clients/android/version.properties
      version_file_key: version
      apk: clients/android/app/build/outputs/apk/release/app-release.apk
      aab: clients/android/app/build/outputs/bundle/release/app-release.aab
      build_command: |
        set -euo pipefail
        cd clients/android
        ./gradlew --no-daemon --console=plain --max-workers=2 \
          :app:assembleRelease :app:bundleRelease
      # 密钥由 action 预置到这两个路径(keystore.properties 的 storeFile 用相对路径)
      keystore_path: clients/android/release.jks
      keystore_properties: clients/android/keystore.properties
      alias_property: alias.OrzMusic
      # debug 自截图钩子的广播 action 不允许进正式包
      forbidden_strings: UiDumpReceiver
      min_target_sdk: "36"
      upload_artifact: true
      release: false
    # 显式映射,不用 `secrets: inherit` —— 本仓库(OrzGeeker)与 EasyRelease
    # (EasyIndie)不在同一个 owner 下,实测 inherit 传过去是空的:构建因此拿不到
    # keystore,静默产出未签名包(app-release-unsigned.apk)。
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 取回校验过的产物
        uses: actions/download-artifact@v4
        with:
          name: easyrelease-OrzMusic-Android
          path: dist/flat

      - name: 解析版本
        id: meta
        run: echo "ver=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"

      - name: 重命名(仓库自己的命名约定)
        env:
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp dist/flat/app-release.apk "dist/OrzMusic-android-$VER.apk"
          cp dist/flat/app-release.aab "dist/OrzMusic-android-$VER.aab"
          ls -l dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: OrzMusic Android ${{ steps.meta.outputs.ver }}
          body: |
            ## OrzMusic Android ${{ steps.meta.outputs.ver }}

            ### 制品
            - `OrzMusic-android-${{ steps.meta.outputs.ver }}.apk` —— 侧载 / 国内商店
            - `OrzMusic-android-${{ steps.meta.outputs.ver }}.aab` —— Google Play 上传

            版本校验 / 签名指纹 / AAB 结构由
            [EasyIndie/EasyRelease](https://github.com/EasyIndie/EasyRelease) 的
            `android-v0.1.0` 完成(manifest 见附件)。

            Git Commit: `${{ github.sha }}`

            > applicationId `com.jokerhub.orzmusic.android` 与签名密钥自首次发布起不再变更,
            > 指纹见 `clients/android/signing-manifest.txt`。
          files: |
            dist/OrzMusic-android-*.apk
            dist/OrzMusic-android-*.aab
            dist/flat/android-manifest.json
          draft: false
          prerelease: false
          generate_release_notes: true
