name: Android client

# 这里与 orzmusic.yml 一样**刻意不设 paths 过滤**。
# GitHub Actions 的 required status check 与 paths 过滤同时存在时,未触及过滤路径的
# PR 永远等不到该 check 上报,会一直停在 "Expected" 而无法合并。
#
# 本 workflow 只验「能编译 + 单测/截图断言 + 生成物不漂移」。
# 真机行为(装包、D-pad、IME)不在 CI 里 —— 设备流程在 EasyAndroid 仓库。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  android-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Robolectric 跑起来时会自己去 Maven 拉 android-all(约 200MB),而它的
      # MavenArtifactFetcher **不做重试** —— 碰上偶发 404 / 镜像抽风,整个 job
      # 直接红(2026-11-21 c9677e8 那次就是:两个 Robolectric 测试类都挂在
      # `java.io.FileNotFoundException at HttpURLConnection`)。这里预下载到
      # ~/.m2 并缓存,Robolectric 发现本地已有就不再联网。
      # 版本必须和 clients/android/app/src/test/resources/robolectric.properties
      # 的 `sdk=35` 对上(sdk=35 → 15-robolectric-13954326-i7)。
      - name: 缓存 Robolectric android-all
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-15-robolectric-13954326-i7

      - name: 预热 Robolectric android-all(缺失时带重试下载)
        env:
          ARTIFACT: android-all-instrumented-15-robolectric-13954326-i7
        run: |
          set -euo pipefail
          jar="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/$ARTIFACT.jar"
          if [ -f "$jar" ] && [ "$(stat -c%s "$jar")" -gt 10000000 ]; then
            echo "已命中缓存:$jar($(stat -c%s "$jar") 字节)"
            exit 0
          fi
          mkdir -p "$(dirname "$jar")"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$jar" \
            "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/$ARTIFACT.jar"
          # 截断的 jar 会让 Robolectric 报难懂的校验错,先自己挡住
          [ "$(stat -c%s "$jar")" -gt 10000000 ] || { echo "下载不完整:$jar" >&2; exit 1; }
          echo "已下载:$jar($(stat -c%s "$jar") 字节)"

      # 截图测试在 CI 上**只断言不出图**:出图是本地迭代用的,
      # 两种模式的开关在 app/build.gradle.kts 的 testOptions 里。
      - name: 单元测试 + 截图断言 + debug 包
        run: |
          cd clients/android
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            :core:test :app:testDebugUnitTest :app:assembleDebug \
            -Proborazzi.test.record=false

      # 基线模式:历史问题固化成基线,只挡**新增**。清掉一批后跑
      #   ./gradlew :app:updateLintBaseline
      - name: Android Lint(基线模式)
        run: cd clients/android && ./gradlew --no-daemon --console=plain --max-workers=2 :app:lintDebug

      # 解码清单是生成物:上游 manifest + profile 变了却没重跑生成器,
      # 这里就会红 —— 否则「格式白名单」会悄悄和 SDK 漂移。
      - name: 生成物一致性
        run: |
          python3 clients/android/scripts/gen-core-manifest.py --check
          python3 clients/android/audio-kit/scripts/gen-manifest.py --check

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: clients/android/app/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: clients/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
