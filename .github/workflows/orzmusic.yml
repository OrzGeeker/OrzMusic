name: OrzMusic

on:
  push:
    paths:
      - "Sources/App/**"
      - "Sources/Run/**"
      - "Resources/**"
      - "Tests/AppTests/**"
      - "Tests/Browser/**"
      - "Package.swift"
      - "Package.resolved"
      - "Dockerfile"
      - "docker-compose.yml"
      - "audio-core-sdk.lock.json"
      - "script/update-audio-core-server.sh"
      - "script/update-audio-core-web.sh"
      - "script/db-backup.sh"
      - "script/release-*.sh"
      - "script/package-deploy.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - "docker-compose.production.yml"
      - "Docs/deployment.md"
      - "Docs/migration.md"
      - ".github/workflows/**.yml"
  pull_request:
    paths:
      - "Sources/App/**"
      - "Sources/Run/**"
      - "Resources/**"
      - "Tests/AppTests/**"
      - "Tests/Browser/**"
      - "Package.swift"
      - "Package.resolved"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - "audio-core-sdk.lock.json"
      - "script/update-audio-core-server.sh"
      - "script/update-audio-core-web.sh"
      - "script/db-backup.sh"
      - "script/release-*.sh"
      - "script/package-deploy.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - "Docs/deployment.md"
      - "Docs/migration.md"
      - ".github/workflows/**.yml"

jobs:
  application-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.audio-core-sdk/server/native/lib
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./script/update-audio-core-server.sh
      - run: ./script/update-audio-core-web.sh
      - run: swift test
      - run: node --test Tests/Browser/*.test.mjs
      - run: docker compose config --quiet
      - run: ./script/package-deploy.sh

  macos-audio-core-smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 部署脚本在 macOS 上走系统自带 bash 3.2（空数组/无参 "$@" 语义与 Linux bash 5
      # 不同），这里显式跑一遍，避免只在 macOS/Windows 复现的脚本回归。
      - run: make script-test
      - run: ./script/update-audio-core-server.sh
      - run: swift run OrzAudioCoreSmoke
