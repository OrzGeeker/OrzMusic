name: OrzMusic

# 这里刻意不设 paths 过滤。GitHub Actions 的 required status check 与 paths 过滤
# 同时存在时，未触及过滤路径的 PR 永远等不到该 check 上报，会一直停在 "Expected"
# 而无法合并。两个 job 都是强制门禁，因此必须覆盖全部变更。
#
# push 只跑 main：分支上的提交由 pull_request 事件覆盖（门禁也是在 PR 上判定的）。
# 若 push 不限定分支，同一个 PR 会因 push 与 pull_request 各触发一次而跑两遍，
# rollup 里出现 4 条重复 check，白白翻倍 CI 占用。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  application-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.audio-core-sdk/server/native/lib
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./script/update-audio-core-server.sh
      - run: ./script/update-audio-core-web.sh
      - run: swift test
      - run: node --test Tests/Browser/*.test.mjs
      - run: docker compose config --quiet
      - run: ./script/package-deploy.sh

  macos-audio-core-smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 部署脚本在 macOS 上走系统自带 bash 3.2（空数组/无参 "$@" 语义与 Linux bash 5
      # 不同），这里显式跑一遍，避免只在 macOS/Windows 复现的脚本回归。
      - run: make script-test
      - run: ./script/update-audio-core-server.sh
      - run: swift run OrzAudioCoreSmoke
