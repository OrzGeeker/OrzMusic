# ─────────────────────────────────────────────────────────────
# OrzMusic Android 客户端版本号 —— 唯一来源
#
# 这里只管**客户端**。服务端版本是仓库根的 VERSION(由 vX.Y.Z tag 发布),
# 两者独立推进:服务端 0.0.x 服务的是 API/部署,客户端 0.x 服务的是 APK 发布。
#
# 推导规则(与 app/build.gradle.kts 一致):
#   versionName = version
#   versionCode = MAJOR*10000 + MINOR*100 + PATCH
#
# 格式:严格 SemVer —— 只允许 MAJOR.MINOR.PATCH。
#   不要写 -beta.1 / +build.7 这类后缀:versionCode 由本值推导,
#   带后缀会让两个不同版本算出同一个 versionCode,装上去无法覆盖升级。
#   预发布阶段就直接涨 MINOR / PATCH。
#
# 怎么改
#   不要手改 —— 发版走:
#     bash script/android-release.sh            # 从提交信息推导段位
#     bash script/android-release.sh --version 0.7.0   # 手工指定
#   它会写这里 + CHANGELOG.md,提交,打 android-v<version> tag 并推送,
#   由 .github/workflows/android-release.yml 出签名 APK/AAB。
#
# 版本历史(旧 → 新)
#   0.6.1  从 EasyAndroid 迁入本仓库前的最后一个版本;迁移本身是 refactor,不涨版本。
#          下一个正式版本从 0.7.0 起。
#   0.7.0  2026-11-20  见 CHANGELOG.md
#   0.7.1  2026-11-20  见 CHANGELOG.md
#   0.8.0  2026-11-21  见 CHANGELOG.md
#   0.8.1  2026-11-21  见 CHANGELOG.md
#   0.8.2  2026-11-21  见 CHANGELOG.md
# ─────────────────────────────────────────────────────────────
version=0.8.2
