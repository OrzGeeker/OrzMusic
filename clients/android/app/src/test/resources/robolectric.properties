# Robolectric 的模拟 SDK 版本。
#
# 应用 targetSdk 是 36(Google Play 2026 政策要求),但 Robolectric 4.17 跑
# Android SDK 36 需要 JDK 21,而本仓库统一 JDK 17:
#
#   java.lang.UnsupportedOperationException: Failed to create a Robolectric
#   sandbox: Android SDK 36 requires Java 21 (have Java 17)
#
# 截图测试只验布局/颜色/文案,API 35 与 36 没有区别;真机验收才是
# targetSdk 36 的真实环境。
sdk=35
